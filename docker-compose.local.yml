volumes:
  piedpiper_local_postgres_data: {}
  piedpiper_local_postgres_data_backups: {}
  piedpiper_local_redis_data: {}
  piedpiper_local_cas: {}      # the content-addressed chunk store
  piedpiper_local_staging: {}  # in-flight uploads, deleted after ingest

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: piedpiper_local_django
    container_name: piedpiper_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
      # Named volumes, not bind mounts: the CAS is the durable artefact and
      # celeryworker must see the exact same bytes the web process staged.
      - piedpiper_local_cas:/data/cas
      - piedpiper_local_staging:/data/staging
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: piedpiper_production_postgres
    container_name: piedpiper_local_postgres
    volumes:
      - piedpiper_local_postgres_data:/var/lib/postgresql/data
      - piedpiper_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: piedpiper_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8.8
    container_name: piedpiper_local_redis
    volumes:
      - piedpiper_local_redis_data:/data

  celeryworker:
    <<: *django
    image: piedpiper_local_celeryworker
    container_name: piedpiper_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: piedpiper_local_celerybeat
    container_name: piedpiper_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: piedpiper_local_flower
    container_name: piedpiper_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
